apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-sre
  labels:
    app: devops-sre

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-sre

  template:
    metadata:
      labels:
        app: devops-sre

    spec:
      containers:
        - name: devops-sre
          image: ghcr.io/shishir-krishna-101/devops-sre:397e332301c9f6073b609cd1fe3b3a76fa409bac

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
