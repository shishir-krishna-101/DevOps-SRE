apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sre-v1
  namespace: devops-sre
  labels:
    app.kubernetes.io/name: devops-sre
    app.kubernetes.io/version-slot: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-sre
      app.kubernetes.io/version-slot: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-sre
        app.kubernetes.io/version-slot: v1
    spec:
      serviceAccountName: devops-sre
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: preflight
          image: busybox:1.36.1
          command: ["sh", "-c", "test -d /tmp"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
      containers:
        - name: devops-sre
          image: ghcr.io/shishir-krishna-101/devops-sre:c54bea5ae5997c77e521f45cb48c49694b53e70e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: devops-sre-config
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 10001
