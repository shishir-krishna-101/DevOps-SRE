prometheus:
  prometheusSpec:
    retention: 3d
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
grafana:
  enabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  persistence:
    enabled: false
  defaultDashboardsEnabled: true
alertmanager:
  enabled: true
prometheusOperator:
  enabled: true
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true
