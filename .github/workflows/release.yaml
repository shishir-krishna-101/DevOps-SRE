name: Release Pipeline

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'gitops/update-image-')
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/shishir-krishna-101/devops-sre
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
      GITOPS_BRANCH: gitops/update-image-${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Verify dependencies
        run: docker run --rm "$IMAGE_NAME:$IMAGE_TAG" python -m pip show msgpack setuptools urllib3

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Update Kubernetes manifest
        run: |
          git switch -c "$GITOPS_BRANCH"
          sed -i "s|^[[:space:]]*image:.*|          image: $IMAGE_NAME:$IMAGE_TAG|" k8s/deployment.yaml
          grep "image:" k8s/deployment.yaml

      - name: Commit and push GitOps branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image to $IMAGE_TAG"
          git push --set-upstream origin "$GITOPS_BRANCH"

      - name: Create GitOps pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$GITOPS_BRANCH" \
            --title "chore: deploy $IMAGE_TAG" \
            --body "Updates k8s/deployment.yaml to $IMAGE_NAME:$IMAGE_TAG. The image passed the final Trivy HIGH/CRITICAL scan. Merge this PR to let ArgoCD reconcile the new image."
