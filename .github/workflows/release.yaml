name: Release Pipeline

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'gitops/update-image-')
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/shishir-krishna-101/devops-sre
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
      GITOPS_BRANCH: gitops/update-image-${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Verify dependencies
        run: docker run --rm "$IMAGE_NAME:$IMAGE_TAG" python -m pip show msgpack setuptools urllib3

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Update Kubernetes manifests
        run: |
          git switch -c "$GITOPS_BRANCH"

          # Get only the image of the devops-sre application container.
          get_app_image() {
            awk '
              /^[[:space:]]*- name: devops-sre[[:space:]]*$/ {
                in_app_container=1
                next
              }

              in_app_container && /^[[:space:]]*image:/ {
                sub(/^[[:space:]]*image:[[:space:]]*/, "")
                print
                exit
              }

              in_app_container && /^[[:space:]]*- name:/ {
                exit
              }
            ' "$1"
          }

          # Update ONLY the image belonging to the devops-sre container.
          set_app_image() {
            file="$1"
            new_image="$2"

            awk -v new_image="$new_image" '
              /^[[:space:]]*- name: devops-sre[[:space:]]*$/ {
                in_app_container=1
                print
                next
              }

              in_app_container && /^[[:space:]]*image:/ {
                match($0, /^[[:space:]]*/)
                indentation=substr($0, RSTART, RLENGTH)
                print indentation "image: " new_image
                in_app_container=0
                next
              }

              in_app_container && /^[[:space:]]*- name:/ {
                in_app_container=0
              }

              {
                print
              }
            ' "$file" > "$file.tmp"

            mv "$file.tmp" "$file"
          }

          # Read the CURRENT application images BEFORE changing anything.
          LATEST_IMAGE=$(get_app_image k8s/deployment_latest.yaml)
          PREVIOUS_IMAGE=$(get_app_image k8s/deployment_previous.yaml)
          OLD_IMAGE=$(get_app_image k8s/deployment_old.yaml)

          # Fail if any application image cannot be found.
          if [ -z "$LATEST_IMAGE" ]; then
            echo "ERROR: Could not find devops-sre image in deployment_latest.yaml"
            exit 1
          fi

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "ERROR: Could not find devops-sre image in deployment_previous.yaml"
            exit 1
          fi

          if [ -z "$OLD_IMAGE" ]; then
            echo "ERROR: Could not find devops-sre image in deployment_old.yaml"
            exit 1
          fi

          NEW_IMAGE="$IMAGE_NAME:$IMAGE_TAG"

          echo "========================================"
          echo "CURRENT IMAGE ROTATION"
          echo "========================================"
          echo "latest   : $LATEST_IMAGE"
          echo "previous : $PREVIOUS_IMAGE"
          echo "old      : $OLD_IMAGE"
          echo "new      : $NEW_IMAGE"

          # Rotate ONLY application images:
          #
          # old      <- previous
          # previous <- latest
          # latest   <- new
          #

          set_app_image k8s/deployment_old.yaml "$PREVIOUS_IMAGE"
          set_app_image k8s/deployment_previous.yaml "$LATEST_IMAGE"
          set_app_image k8s/deployment_latest.yaml "$NEW_IMAGE"

          echo ""
          echo "========================================"
          echo "NEW IMAGE ROTATION"
          echo "========================================"
          echo "latest   : $(get_app_image k8s/deployment_latest.yaml)"
          echo "previous : $(get_app_image k8s/deployment_previous.yaml)"
          echo "old      : $(get_app_image k8s/deployment_old.yaml)"

          echo ""
          echo "========================================"
          echo "VERIFY YAML IMAGES"
          echo "========================================"

          grep -n "image:" \
            k8s/deployment_latest.yaml \
            k8s/deployment_previous.yaml \
            k8s/deployment_old.yaml
            
      - name: Commit and push GitOps branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/deployment_latest.yaml \
            k8s/deployment_previous.yaml \
            k8s/deployment_old.yaml

          git commit -m "chore: rotate deployment images to $IMAGE_TAG"

          git push -u origin "$GITOPS_BRANCH"

      - name: Create GitOps pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$GITOPS_BRANCH" \
            --title "chore: rotate deployment images to $IMAGE_TAG" \
            --body "Rotates the application container images. The new image becomes latest, the previous latest moves to previous, and the previous image moves to old. New image: $IMAGE_NAME:$IMAGE_TAG. The image passed the final Trivy HIGH/CRITICAL scan. Merge this GitOps PR to let Argo CD reconcile the updated desired state."