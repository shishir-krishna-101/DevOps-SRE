name: Release Pipeline

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'gitops/update-image-')
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/shishir-krishna-101/devops-sre
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
      GITOPS_BRANCH: gitops/update-image-${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Verify image dependencies
        run: |
          docker run --rm "$IMAGE_NAME:$IMAGE_TAG" \
            python -m pip show msgpack setuptools urllib3

      - name: Scan final image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push image to GHCR
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Create GitOps branch
        run: |
          git switch -c "$GITOPS_BRANCH"

      - name: Update Kubernetes image tag
        run: |
          sed -i \
            "s|image: $IMAGE_NAME:IMAGE_TAG|image: $IMAGE_NAME:$IMAGE_TAG|" \
            k8s/deployment.yaml

      - name: Verify manifest change
        run: |
          grep "image:" k8s/deployment.yaml

      - name: Commit GitOps manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes."
            exit 0
          fi

          git commit -m "chore: update image to $IMAGE_TAG"

      - name: Push GitOps branch
        run: |
          git push --set-upstream origin "$GITOPS_BRANCH"

      - name: Create GitOps Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$GITOPS_BRANCH" \
            --title "chore: deploy $IMAGE_TAG" \
            --body "## GitOps Deployment Update

This PR updates the Kubernetes Deployment image to:

\`$IMAGE_NAME:$IMAGE_TAG\`

The image was built, dependency-verified, and passed the final Trivy HIGH/CRITICAL vulnerability gate before this PR was created.

Once merged, ArgoCD can reconcile the updated manifest from Git."
