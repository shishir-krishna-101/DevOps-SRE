name: Release Pipeline

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'gitops/update-image-')
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/shishir-krishna-101/devops-sre
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
      GITOPS_BRANCH: gitops/update-image-${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Verify dependencies
        run: docker run --rm "$IMAGE_NAME:$IMAGE_TAG" python -m pip show msgpack setuptools urllib3

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Update Kubernetes manifest
        run: |
          git switch -c "$GITOPS_BRANCH"

          # Read the currently deployed images before making any changes.
          LATEST_IMAGE=$(grep -m1 '^[[:space:]]*image: g' k8s/deployment_latest.yaml | awk '{print $2}')
          PREVIOUS_IMAGE=$(grep -m1 '^[[:space:]]*image: g' k8s/deployment_previous.yaml | awk '{print $2}')

          echo "Current image rotation:"
          echo "latest   : $LATEST_IMAGE"
          echo "previous : $PREVIOUS_IMAGE"
          echo "old      : $(grep -m1 '^[[:space:]]*image: g' k8s/deployment_old.yaml | awk '{print $2}')"
          sed -i "s|^[[:space:]]*image:.*|          image: $PREVIOUS_IMAGE|" \
          k8s/deployment_old.yaml

          sed -i "s|^[[:space:]]*image:.*|          image: $LATEST_IMAGE|" \
            k8s/deployment_previous.yaml

          sed -i "s|^[[:space:]]*image:.*|          image: $IMAGE_NAME:$IMAGE_TAG|" \
            k8s/deployment_latest.yaml

          echo ""
          echo "New image rotation:"
          grep "image:" \
            k8s/deployment_latest.yaml \
            k8s/deployment_previous.yaml \
            k8s/deployment_old.yaml

      - name: Commit and push GitOps branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            k8s/deployment_latest.yaml \
            k8s/deployment_previous.yaml \
            k8s/deployment_old.yaml
          git commit -m "rotating image to $IMAGE_TAG"
          git push -u origin "$GITOPS_BRANCH"

      - name: Create GitOps pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "$GITOPS_BRANCH" \
            --title "chore: rotate deployment images to $IMAGE_TAG" \
            --body "Rotates the application container images across the three deployment manifests. The new image is $IMAGE_NAME:$IMAGE_TAG. The latest image moves to previous, and the previous image moves to old. The new image passed the final Trivy HIGH/CRITICAL scan. Merge this PR to let Argo CD reconcile the updated desired state."