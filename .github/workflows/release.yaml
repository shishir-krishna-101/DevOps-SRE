name: Release Pipeline

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/shishir-krishna-101/devops-sre
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Verify image dependencies
        run: |
          docker run --rm "$IMAGE_NAME:$IMAGE_TAG" \
            python -m pip show msgpack setuptools urllib3

      - name: Scan final image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push image to GHCR
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Update Kubernetes image tag
        run: |
          sed -i \
            "s|image: $IMAGE_NAME:IMAGE_TAG|image: $IMAGE_NAME:$IMAGE_TAG|" \
            k8s/deployment.yaml

      - name: Verify manifest change
        run: |
          grep "image:" k8s/deployment.yaml

      - name: Commit Kubernetes manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "chore: update image to $IMAGE_TAG"
            git push origin main
          fi
